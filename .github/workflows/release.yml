name: Release Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag or name, for example v1.0.0"
        required: true
        type: string
      build_number:
        description: "Optional Flutter build number override"
        required: false
        type: string
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: true
        default: true
        type: boolean
      release_notes:
        description: "Optional release notes"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.38.7"
  JAVA_VERSION: "17"

jobs:
  android:
    name: Android release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android artifacts with fastlane
        env:
          BUILD_NUMBER: ${{ github.event.inputs.build_number }}
        run: bundle exec fastlane android build_release_artifacts

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-release-artifacts
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS release build
    runs-on: macos-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Build unsigned iOS artifact with fastlane
        env:
          BUILD_NUMBER: ${{ github.event.inputs.build_number }}
        run: bundle exec fastlane ios build_unsigned

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-release-artifact
          path: build/release/scanify-ios-no-codesign.zip
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - android
      - ios

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
          RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
          PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find dist -type f -print0)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release files found."
            exit 1
          fi

          notes="${RELEASE_NOTES:-Automated Scanify build.}"
          prerelease_flag=()
          if [ "${PRERELEASE:-false}" = "true" ]; then
            prerelease_flag+=(--prerelease)
          fi

          if gh release view "$RELEASE_NAME" >/dev/null 2>&1; then
            gh release upload "$RELEASE_NAME" "${files[@]}" --clobber
          else
            gh release create "$RELEASE_NAME" "${files[@]}" \
              --title "$RELEASE_NAME" \
              --notes "$notes" \
              "${prerelease_flag[@]}"
          fi
